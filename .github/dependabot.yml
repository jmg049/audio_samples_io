# Major versions of the crates whose types cross into audio_samples or
# audio_samples_python are not proposed: they have to move in all the
# repositories at once.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "non-empty-slice"
        update-types: ["version-update:semver-major"]
      - dependency-name: "non-empty-iter"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pyo3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-and-patch:
        update-types: ["minor", "patch"]
